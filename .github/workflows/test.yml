name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: target/host
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
      - name: Install Rust UWP build toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: nightly
        with:
          workspaces: . -> target/host
          cache-directories: target/uwp
          cache-bin: false
          key: uwp-${{ hashFiles('pixi.toml') }}
      - name: Run tests
        run: pixi run --locked test
      - name: Build Rust library (release)
        run: pixi run --locked build
      - name: Build Rust UWP library (release)
        env:
          CARGO_TARGET_DIR: target/uwp
        run: pixi run --locked build-uwp-core
