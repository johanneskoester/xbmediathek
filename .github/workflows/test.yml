name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Use the normal rust-cache workspace cleanup for host builds.
      CARGO_TARGET_DIR: target/host
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
      - name: Restore WinUI metadata
        run: |
          nuget install Microsoft.UI.Xaml -Version 2.8.7 -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .windows/winmd | Out-Null
          Copy-Item "$env:RUNNER_TEMP\nuget\Microsoft.UI.Xaml.2.8.7\lib\uap10.0\Microsoft.UI.Xaml.winmd" .windows/winmd/
          Copy-Item "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.1.0.2849.39\lib\Microsoft.Web.WebView2.Core.winmd" .windows/winmd/
      - name: Install Rust UWP build toolchain
        run: rustup toolchain install nightly-2026-08-15 --profile minimal --component rust-src
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-08-15
        with:
          workspaces: . -> target/host
          # Cache UWP separately: workspace cleanup can remove build-std
          # artifacts because they are not listed as project dependencies.
          cache-directories: target/uwp
          cache-bin: false
          key: uwp-nightly-2026-08-15
      - name: Lint
        run: pixi run --locked lint
      - name: Format
        run: pixi run --locked format
      - name: Run tests
        run: pixi run --locked test
      - name: Build Rust library (release)
        run: pixi run --locked build
      - name: Build Rust UWP host (release)
        env:
          # Match the separately cached directory above.
          CARGO_TARGET_DIR: target/uwp
        run: pixi run --locked build-uwp-core
